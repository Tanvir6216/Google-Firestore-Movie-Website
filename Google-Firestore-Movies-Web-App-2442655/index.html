<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope | Netflix Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="netflix-bg text-white">

<nav class="navbar navbar-dark bg-black py-3 shadow">
    <div class="container">
        <span class="navbar-brand fw-bold text-danger fs-2" style="letter-spacing: 2px;">CINESCOPE</span>
    </div>
</nav>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-3 fw-bold text-white">🎬 Movie Ratings & Reviews</h1>
        <p class="lead text-light">Your personal cinematic library, styled for the big screen.</p>
    </div>

    <div class="card bg-dark shadow-lg border-0 mb-5 netflix-form-card">
        <div class="card-body p-4">
            <h5 class="text-white fw-bold mb-4">🎬 Add New Movies</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold text-white">🎬 Movie Name</label>
                    <input id="name" class="form-control netflix-input" placeholder="e.g. Inception" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-bold text-white">Poster Image URL</label>
                    <input id="poster" class="form-control netflix-input" placeholder="Paste image link here...">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-white">Rating (0-5)</label>
                    <input id="rating" type="number" class="form-control netflix-input" min="0" max="5" placeholder="5" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-white">Genre</label>
                    <input id="genre" class="form-control netflix-input" placeholder="e.g. Action, Crime, Mystery, Thriller, Drama, Sci-Fi">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-white">Director Name</label>
                    <input id="director" class="form-control netflix-input" placeholder="e.g. Christopher Nolan">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-white">Release Date</label>
                    <input id="date" type="date" class="form-control netflix-input">
                </div>
                <div class="col-12 mt-4">
                    <button class="btn btn-danger w-100 fw-bold py-2 netflix-red-btn" onclick="addMovie()">ADD TO COLLECTION</button>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex align-items-center justify-content-between mb-4 border-bottom border-secondary pb-3">
        <h3 class="fw-bold mb-0 text-white">🎬 My Movies Library</h3>
        <div class="d-flex align-items-center bg-dark px-3 py-1 rounded">
            <label class="me-2 small text-light text-uppercase fw-bold">Sort:</label>
            <select class="form-select form-select-sm bg-transparent border-0 text-white" onchange="sortMovies(this.value)">
                <option value="" class="bg-dark text-white">Default</option>
                <option value="movie_name" class="bg-dark text-white">Alphabetical</option>
                <option value="movie_rating" class="bg-dark text-white">Top Rated</option>
                <option value="releaseDate" class="bg-dark text-white">Release Date</option>
            </select>
        </div>
    </div>

    <div id="movies" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title fw-bold text-white">Edit Movie Details</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-id">
                <div class="mb-3">
                    <label class="fw-bold text-white">🎬 Movie Name</label>
                    <input id="edit-name" class="form-control netflix-input">
                </div>
                <div class="mb-3">
                    <label class="fw-bold text-white">Genre</label>
                    <input id="edit-genre" class="form-control netflix-input">
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="fw-bold text-white">Rating (0-5)</label>
                        <input id="edit-rating" type="number" class="form-control netflix-input" min="0" max="5">
                    </div>
                    <div class="col-6">
                        <label class="fw-bold text-white">Release Date</label>
                        <input id="edit-date" type="date" class="form-control netflix-input">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="fw-bold text-white">Director</label>
                    <input id="edit-director" class="form-control netflix-input">
                </div>
                <div class="mb-3">
                    <label class="fw-bold text-white">Poster URL</label>
                    <input id="edit-poster" class="form-control netflix-input">
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary text-white" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger netflix-red-btn" onclick="saveEdit()">SAVE CHANGES</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
